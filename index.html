<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    padding: 24px;
    max-width: 1100px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 20px;
  }

  header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #1a1a2e;
  }

  header .timestamp {
    font-size: 0.82rem;
    color: #777;
    margin-top: 4px;
  }

  .staleness-banner {
    display: none;
    padding: 10px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 0.85rem;
    text-align: center;
    font-weight: 500;
  }

  .staleness-banner.fresh { display: none; }
  .staleness-banner.aging { display: block; background: #fff3cd; color: #856404; }
  .staleness-banner.stale { display: block; background: #f8d7da; color: #721c24; }

  .verdict-section {
    background: #fff;
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    text-align: center;
  }

  .verdict-badge {
    display: inline-block;
    padding: 10px 28px;
    border-radius: 8px;
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: 0.03em;
    margin-bottom: 6px;
  }

  .verdict-badge.risk-on { background: #d4edda; color: #155724; }
  .verdict-badge.leaning-risk-on { background: #fff3cd; color: #856404; }
  .verdict-badge.mixed { background: #ffe0cc; color: #8a4500; }
  .verdict-badge.risk-off { background: #f8d7da; color: #721c24; }

  .verdict-score {
    font-size: 0.9rem;
    color: #666;
    margin-top: 4px;
    margin-bottom: 20px;
  }

  .signals-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 16px;
  }

  @media (max-width: 600px) {
    .signals-row { grid-template-columns: repeat(2, 1fr); }
  }

  .signal-card {
    border-radius: 8px;
    padding: 14px 12px;
    text-align: center;
    position: relative;
  }

  .signal-card.clear { background: #e8f5e9; border: 1px solid #a5d6a7; }
  .signal-card.caution { background: #fce4ec; border: 1px solid #ef9a9a; }

  .signal-card .signal-name {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    color: #555;
    letter-spacing: 0.04em;
  }

  .signal-card .signal-value {
    font-size: 1.3rem;
    font-weight: 700;
    margin: 4px 0;
  }

  .signal-card.clear .signal-value { color: #2e7d32; }
  .signal-card.caution .signal-value { color: #c62828; }

  .signal-card .signal-threshold {
    font-size: 0.72rem;
    color: #888;
  }

  .signal-card .signal-status {
    font-size: 0.78rem;
    font-weight: 600;
    margin-top: 2px;
  }

  .signal-card.clear .signal-status { color: #2e7d32; }
  .signal-card.caution .signal-status { color: #c62828; }

  .flip-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 10px;
    background: #1a1a2e;
    color: #fff;
    letter-spacing: 0.04em;
  }

  .attention-card {
    background: #fffbea;
    border-left: 4px solid #f59e0b;
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .attention-card h2 {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #78350f;
    margin-bottom: 10px;
  }

  .attention-card ul {
    list-style: none;
  }

  .attention-card li {
    font-size: 0.88rem;
    color: #1a1a2e;
    padding: 4px 0 4px 18px;
    position: relative;
    line-height: 1.4;
  }

  .attention-card li::before {
    content: "\25B8";
    position: absolute;
    left: 0;
    color: #f59e0b;
    font-weight: 700;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }

  @media (max-width: 700px) {
    .cards-grid { grid-template-columns: 1fr; }
  }

  .data-card {
    background: #fff;
    border-radius: 10px;
    padding: 18px 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .data-card h2 {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #444;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid #f0f2f5;
  }

  .data-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid #f5f5f5;
    gap: 8px;
  }

  .data-row:last-child { border-bottom: none; }

  .data-name {
    font-size: 0.82rem;
    color: #555;
    flex: 1;
    min-width: 0;
  }

  .data-spark {
    width: 60px;
    height: 20px;
    flex-shrink: 0;
    opacity: 0.8;
  }

  .data-spark.empty {
    width: 60px;
    height: 20px;
  }

  .data-value {
    font-size: 0.88rem;
    font-weight: 600;
    color: #1a1a2e;
    text-align: right;
    min-width: 75px;
  }

  .data-change {
    font-size: 0.78rem;
    font-weight: 600;
    text-align: right;
    min-width: 70px;
  }

  .data-change.positive { color: #2e7d32; }
  .data-change.negative { color: #c62828; }
  .data-change.neutral { color: #999; }

  .na { color: #bbb; font-style: italic; }

  .spread-note {
    font-size: 0.72rem;
    color: #888;
    margin-top: 6px;
    text-align: right;
  }

  #error-banner {
    display: none;
    background: #fff3cd;
    color: #856404;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 0.85rem;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>Macro Tracker</h1>
  <div class="timestamp" id="timestamp">Loading...</div>
</header>

<div id="error-banner"></div>
<div class="staleness-banner" id="staleness-banner"></div>

<div class="verdict-section" id="verdict-section">
  <div class="verdict-badge" id="verdict-badge">—</div>
  <div class="verdict-score" id="verdict-score"></div>
  <div class="signals-row" id="signals-row"></div>
</div>

<div class="attention-card" id="attention-card" style="display:none">
  <h2>Needs Your Attention</h2>
  <ul id="attention-list"></ul>
</div>

<div class="cards-grid" id="cards-grid"></div>

<script>
(async function() {
  const banner = document.getElementById("error-banner");

  let data;
  try {
    const resp = await fetch("data.json");
    if (!resp.ok) throw new Error("Failed to load data.json");
    data = await resp.json();
  } catch (e) {
    banner.textContent = "Could not load data.json. Run python fetch.py first.";
    banner.style.display = "block";
    return;
  }

  let history = {};
  try {
    const h = await fetch("history.json");
    if (h.ok) history = await h.json();
  } catch (e) {}

  document.getElementById("timestamp").textContent =
    "Last updated: " + new Date(data.timestamp).toLocaleString();

  renderStaleness(data.timestamp);
  renderVerdict(data.verdict);
  renderSignals(data.signals);
  renderAttention(data.attention);
  renderCards(data, history);

  function renderStaleness(timestamp) {
    const banner = document.getElementById("staleness-banner");
    const ageMs = Date.now() - new Date(timestamp).getTime();
    const ageHours = ageMs / (1000 * 60 * 60);

    if (ageHours < 6) {
      banner.className = "staleness-banner fresh";
    } else if (ageHours < 24) {
      banner.className = "staleness-banner aging";
      banner.textContent = "\u26A0 Data is " + Math.round(ageHours) + " hours old — refresh scheduled daily";
    } else {
      banner.className = "staleness-banner stale";
      banner.textContent = "\u26A0 Data is " + Math.round(ageHours) + " hours old — scheduled refresh may have failed";
    }
  }

  function renderVerdict(verdict) {
    const badge = document.getElementById("verdict-badge");
    const score = document.getElementById("verdict-score");

    const classMap = {
      "FULL RISK-ON": "risk-on",
      "LEANING RISK-ON": "leaning-risk-on",
      "MIXED": "mixed",
      "RISK-OFF": "risk-off"
    };

    const emojiMap = {
      "FULL RISK-ON": "\u{1F7E2}",
      "LEANING RISK-ON": "\u{1F7E1}",
      "MIXED": "\u{1F7E0}",
      "RISK-OFF": "\u{1F534}"
    };

    badge.textContent = (emojiMap[verdict.label] || "") + " " + verdict.label;
    badge.className = "verdict-badge " + (classMap[verdict.label] || "");
    score.textContent = verdict.score + "/" + verdict.total + " signals clear";
  }

  function renderSignals(signals) {
    const row = document.getElementById("signals-row");
    row.innerHTML = "";

    const labels = {
      vix: "VIX",
      dxy: "DXY",
      rate_cut_spread: "2Y \u2212 Fed",
      hy_spread: "HY Spread",
    };
    const fmt = {
      vix: v => v.toFixed(2),
      dxy: v => v.toFixed(2),
      rate_cut_spread: v => (v > 0 ? "+" : "") + v.toFixed(2) + "%",
      hy_spread: v => v.toFixed(2) + "%",
    };
    const threshFmt = {
      vix: "< 20",
      dxy: "< 98",
      rate_cut_spread: "< \u22120.25%",
      hy_spread: "< 3.50%",
    };

    for (const [key, signal] of Object.entries(signals)) {
      const card = document.createElement("div");
      card.className = "signal-card " + signal.status;
      card.setAttribute("data-signal", key);

      const valStr = signal.value != null ? (fmt[key] ? fmt[key](signal.value) : signal.value) : "N/A";
      const statusStr = signal.status === "clear" ? "\u2705 CLEAR" : "\u{1F534} CAUTION";

      let flipBadge = "";
      if (signal.flipped && signal.previous_status) {
        flipBadge = '<div class="flip-badge">FLIP</div>';
      }

      card.innerHTML =
        flipBadge +
        '<div class="signal-name">' + labels[key] + '</div>' +
        '<div class="signal-value">' + valStr + '</div>' +
        '<div class="signal-threshold">Target: ' + threshFmt[key] + '</div>' +
        '<div class="signal-status">' + statusStr + '</div>';

      row.appendChild(card);
    }
  }

  function renderAttention(bullets) {
    if (!bullets || bullets.length === 0) return;
    const card = document.getElementById("attention-card");
    const list = document.getElementById("attention-list");
    list.innerHTML = "";
    for (const b of bullets) {
      const li = document.createElement("li");
      li.textContent = b;
      list.appendChild(li);
    }
    card.style.display = "block";
  }

  function renderCards(data, history) {
    const grid = document.getElementById("cards-grid");
    grid.innerHTML = "";

    const sections = [
      { key: "equities", title: "Equities" },
      { key: "fx_rates", title: "FX & Rates" },
      { key: "commodities", title: "Commodities" },
      { key: "energy", title: "Energy" },
      { key: "crypto", title: "Crypto" }
    ];

    const unitHints = {
      "ust2y": "%", "ust10y": "%", "fed_funds": "%", "bi_rate": "%",
      "indo_10y": "%", "spread_2s10s": "%", "hy_spread": "%", "vix": ""
    };

    for (const section of sections) {
      const sectionData = data[section.key];
      if (!sectionData) continue;

      const card = document.createElement("div");
      card.className = "data-card";
      card.setAttribute("data-section", section.key);

      let html = '<h2>' + section.title + '</h2>';

      for (const [key, item] of Object.entries(sectionData)) {
        const valStr = item.value != null ? formatValue(key, item.value) : '<span class="na">N/A</span>';
        const unit = unitHints[key] || "";
        const changeStr = formatChange(item.change, key);
        const spark = sparkline(historyValues(history, key));

        html +=
          '<div class="data-row" data-key="' + key + '">' +
            '<span class="data-name">' + item.name + '</span>' +
            spark +
            '<span class="data-value">' + valStr + (item.value != null ? unit : "") + '</span>' +
            '<span class="data-change ' + changeClass(item.change) + '">' + changeStr + '</span>' +
          '</div>';
      }

      if (section.key === "fx_rates") {
        const spread = sectionData.spread_2s10s;
        if (spread && spread.value != null) {
          const inverted = spread.value < 0;
          html += '<div class="spread-note">' + (inverted ? "Curve inverted" : "Curve normal") + '</div>';
        }
      }

      card.innerHTML = html;
      grid.appendChild(card);
    }
  }

  function historyValues(history, key) {
    const dates = Object.keys(history).sort();
    const values = [];
    for (const d of dates) {
      const v = history[d][key];
      if (typeof v === "number") values.push(v);
    }
    return values;
  }

  function sparkline(values) {
    if (!values || values.length < 2) {
      return '<svg class="data-spark empty" viewBox="0 0 60 20"><line x1="0" y1="10" x2="60" y2="10" stroke="#ddd" stroke-width="1" stroke-dasharray="2,2"/></svg>';
    }
    const w = 60, h = 20;
    const min = Math.min(...values);
    const max = Math.max(...values);
    const range = max - min || 1;
    const pts = values.map((v, i) => {
      const x = (i / (values.length - 1)) * w;
      const y = h - ((v - min) / range) * (h - 2) - 1;
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
    const last = values[values.length - 1];
    const first = values[0];
    const color = last > first ? "#2e7d32" : last < first ? "#c62828" : "#999";
    return '<svg class="data-spark" viewBox="0 0 60 20"><polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function formatValue(key, val) {
    if (val == null) return "N/A";
    if (key === "btc" || key === "eth") return "$" + val.toLocaleString(undefined, {maximumFractionDigits: 0});
    if (key === "usdidr") return val.toLocaleString(undefined, {maximumFractionDigits: 0});
    if (key === "sp500" || key === "nasdaq" || key === "ihsg") return val.toLocaleString(undefined, {maximumFractionDigits: 2});
    if (key === "gold" || key === "silver" || key === "brent" || key === "wti" || key === "coal" || key === "natgas" || key === "cpo") return val.toLocaleString(undefined, {maximumFractionDigits: 2});
    if (key === "nickel" || key === "aluminium" || key === "tin") return val.toLocaleString(undefined, {maximumFractionDigits: 0});
    if (key === "copper") return val.toFixed(4);
    return typeof val === "number" ? val.toFixed(2) : val;
  }

  function formatChange(change, key) {
    if (change == null) return '<span class="neutral">\u2014</span>';
    const arrow = change > 0 ? "\u25B2" : change < 0 ? "\u25BC" : "";
    const sign = change > 0 ? "+" : "";

    const isAbsolute = ["ust2y", "ust10y", "fed_funds", "bi_rate", "indo_10y", "spread_2s10s", "hy_spread"].includes(key);
    if (isAbsolute) {
      return arrow + " " + sign + change.toFixed(2);
    }
    return arrow + " " + sign + change.toFixed(2) + "%";
  }

  function changeClass(change) {
    if (change == null) return "neutral";
    return change > 0 ? "positive" : change < 0 ? "negative" : "neutral";
  }
})();
</script>
</body>
</html>
